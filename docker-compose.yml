services:
  db:
    image: postgres:16-alpine
    container_name: BactGen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: BactGen
      POSTGRES_PASSWORD: BactGen_xD
      POSTGRES_DB: BactGenDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U BactGen -d BactGenDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: